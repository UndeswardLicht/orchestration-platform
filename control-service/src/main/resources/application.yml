spring:
  application:
    name: control-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${LTP_DB_URL:jdbc:postgresql://localhost:5432/ltp}
    username: ${LTP_DB_USER:ltp}
    password: ${LTP_DB_PASSWORD:ltp}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    version: openapi_3_0
  swagger-ui:
    path: /swagger-ui.html

ltp:
  version: ${LTP_VERSION:dev}
  limits:
    # NFR-06 / NFR-05 defaults; persisted in the settings table from T-03 on
    max-rps: 1000
    max-duration-sec: 1800
    k6-cpu: 1.0
    k6-mem-mb: 512
  worker:
    registration-token: ${LTP_WORKER_REGISTRATION_TOKEN:change-me}
    heartbeat-timeout: 15s
