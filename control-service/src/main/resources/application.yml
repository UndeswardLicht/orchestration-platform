spring:
  application:
    name: control-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${LTP_DB_URL:jdbc:postgresql://localhost:5432/ltp}
    username: ${LTP_DB_USER:ltp}
    password: ${LTP_DB_PASSWORD:ltp}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  shutdown: graceful
  servlet:
    session:
      # Sign-out after this much inactivity (US-23); every request resets the clock
      timeout: ${LTP_SESSION_TIMEOUT:8h}
      cookie:
        name: LTP_SESSION
        http-only: true
        same-site: lax
        # Only over HTTPS. Browsers also accept Secure cookies on http://localhost; set
        # LTP_SECURE_COOKIES=false only for plain-HTTP setups on another host name.
        secure: ${LTP_SECURE_COOKIES:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    version: openapi_3_0
  swagger-ui:
    path: /swagger-ui.html
    # "Try it out" sends the XSRF-TOKEN cookie value in the X-XSRF-TOKEN header
    csrf:
      enabled: true

ltp:
  version: ${LTP_VERSION:dev}
  # Limits (max RPS, max duration, k6 CPU/RAM, warm-up) live in the settings table (V1 migration).
  admin:
    # First admin, created on start only if no admin exists (AdminSeeder). The password is required
    # until then; an empty value stops the start with a message.
    login: ${LTP_ADMIN_LOGIN:admin}
    password: ${LTP_ADMIN_PASSWORD:}
  security:
    # Same value as server.servlet.session.cookie.secure, applied to the CSRF cookie
    secure-cookies: ${LTP_SECURE_COOKIES:true}
  worker:
    registration-token: ${LTP_WORKER_REGISTRATION_TOKEN:change-me}
    heartbeat-timeout: 15s
