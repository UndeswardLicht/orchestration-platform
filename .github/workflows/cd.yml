# T-08 (Sprint 5): build images → GHCR → deploy to the Azure VM over SSH.
# Deploy runs only when the repository variable LTP_DEPLOY_ENABLED is 'true' and these secrets exist:
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY  (the VM holds deploy/.env, never committed)
name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: cd
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build and push images
    # Until T-08 (Sprint 5) images are pushed only for release tags, manual runs, or once deploy is enabled
    if: vars.LTP_DEPLOY_ENABLED == 'true' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: control
            module: control-service
            dockerfile: Dockerfile
          - image: worker
            module: worker-service
            dockerfile: Dockerfile
          - image: demo-target
            module: demo-target
            dockerfile: Dockerfile
          - image: web
            module: ""
            dockerfile: web/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - name: Image prefix (GHCR needs lower-case)
        run: echo "PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ltp" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.PREFIX }}/${{ matrix.image }}
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: MODULE=${{ matrix.module }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to Azure VM
    needs: images
    if: vars.LTP_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/ltp
            git pull --ff-only
            docker compose -f deploy/docker-compose.yml pull
            docker compose -f deploy/docker-compose.yml up -d --no-build
            docker image prune -f
